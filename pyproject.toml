[project]
name = "farelocker"
version = "0.1.0"
description = "Hacklanta 2026 - FareLocker API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "apscheduler>=3.11.3",
    "fast-flights @ git+https://github.com/StephenSulimani/flights.git@549bfd2",
    "fastapi[standard]>=0.143.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "PyJWT[crypto]>=2.10.1",
    "sqlalchemy[asyncio]>=2.1.4",
]

[dependency-groups]
dev = [
    "pandas-stubs>=2.1.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
