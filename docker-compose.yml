services:
  db:
    image: pgvector/pgvector:pg18-trixie
    container_name: farelocker-db
    restart: always
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    env_file:
      - .env
    ports:
      - "5432:5432" # Comment out in production
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    container_name: farelocker-api
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    ports:
      - "8000:8000"
    user: "${HOST_UID}:${HOST_GID}"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy


volumes:
  pgdata:

