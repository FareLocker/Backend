services:
  db:
    image: pgvector/pgvector:pg18-trixie
    container_name: farelocker-db
    restart: always
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    env_file:
      - .env
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432" # Host port avoids collisions with local PostgreSQL
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    container_name: farelocker-api
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "8000:8000"
    user: "${HOST_UID}:${HOST_GID}"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

  photon-worker:
    build: ./hacklanta
    container_name: farelocker-photon-worker
    restart: always
    env_file:
      - ./hacklanta/.env
    expose:
      - "8787"


volumes:
  pgdata:
